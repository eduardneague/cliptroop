# Automatic checks on every update: a push to any branch, and every pull
# request. A red ✗ next to the commit means something below failed; Vercel
# still deploys, so look before merging staging into main.
name: CI

on:
  push:
  pull_request:

# 1.31.0: the token these jobs get can only read the code (they never write to the repository).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Types, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Stand-ins: the build never talks to a real database.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          NEXT_TELEMETRY_DISABLED: "1"

  audit:
    # 1.31.2: a red ✗ here means a package the app ships has a known high or critical
    # vulnerability: update it (npm install <package>@<fixed version>) or merge Dependabot's fix.
    name: Known vulnerabilities in what the app ships
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: npm audit (high and critical, the app's own packages)
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migrations apply from scratch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Postgres client
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
      - name: Run every migration on an empty database (and the newest one twice), then the access checks
        run: bash scripts/db/test-from-scratch.sh
        env:
          TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
